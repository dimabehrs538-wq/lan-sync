name: 构建 Windows 安装包

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false  # 内核无第三方依赖

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Go 单元测试
        working-directory: core
        run: go test ./...

      - name: 下载 Syncthing
        shell: pwsh
        run: ./scripts/fetch-syncthing.ps1

      - name: 编译 Go 内核
        shell: pwsh
        run: ./scripts/build-core.ps1

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 构建 Tauri 安装包
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: TeamSync-windows-x64
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.sig
            app/src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: error

      - name: 生成 latest.json（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.TrimStart('v')
          $conf = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($conf.version -ne $version) { throw "标签 $env:TAG 与 tauri.conf.json 版本 $($conf.version) 不一致" }
          git fetch --force origin "refs/tags/$($env:TAG):refs/tags/$($env:TAG)"
          $notes = (git tag -l --format='%(contents)' $env:TAG | Out-String).Trim()
          if (-not $notes) { $notes = "TeamSync $version" }
          $base = "https://github.com/$env:REPO/releases/download/$env:TAG"
          $exe = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $msi = Get-ChildItem app/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $exeSig = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
          $msiSig = (Get-Content "$($msi.FullName).sig" -Raw).Trim()
          # GitHub 会把文件名中的空格替换为点，这里文件名不含空格
          $nsis = @{ signature = $exeSig; url = "$base/$($exe.Name)" }
          $msiE = @{ signature = $msiSig; url = "$base/$($msi.Name)" }
          $json = [ordered]@{
            version  = $version
            notes    = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              'windows-x86_64'      = $nsis
              'windows-x86_64-nsis' = $nsis
              'windows-x86_64-msi'  = $msiE
            }
          }
          $json | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM latest.json
          Get-Content latest.json

      - name: 创建 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/msi/*.msi.sig
            latest.json
