name: 构建 Windows 安装包

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false  # 内核无第三方依赖

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Go 单元测试
        working-directory: core
        run: go test ./...

      - name: 下载 Syncthing
        shell: pwsh
        run: ./scripts/fetch-syncthing.ps1

      - name: 编译 Go 内核
        shell: pwsh
        run: ./scripts/build-core.ps1

      - name: 安装前端依赖
        working-directory: app
        run: npm ci

      - name: 构建 Tauri 安装包
        working-directory: app
        run: npx tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: TeamSync-windows-x64
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: 创建 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
